<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  μLAB (mu-lab) — Frenos y embragues
  Universidad Nacional de San Juan — Facultad de Ingeniería — Cátedra Mecanismos
  Desarrollo: Ing. Manuel Galdeano Ruiz
  Material didáctico de la Cátedra Mecanismos (FI-UNSJ).
-->
<meta name="author" content="Ing. Manuel Galdeano Ruiz — Cátedra Mecanismos, Facultad de Ingeniería, Universidad Nacional de San Juan">
<title>μLAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco de trabajo — barra de módulos arriba, panel de control a la izquierda, lámina milimetrada a la derecha.
   Misma familia visual que MECALAB y CONTACTLAB. */
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --canvas:#f7f9f8; --ink:#1b2320; --muted:#5d6a64; --line:#d3dbd7;
  --grid:#e4eae7; --grid2:#d2dbd6;
  --b1:#c9500a; --b1f:#fbeee6; --b2:#8a3fa8; --b2f:#f3eaf7; --geo:#1d7f47; --hot:#d97706; --warn:#c0392b;
  --accent:#c9500a; --accent-ink:#ffffff;
  --l1:#6b7570; --l2:#1f6fb2; --l3:#1d7f47; --l4:#c9500a; --l5:#8a3fa8; --l6:#0f8b8d;
  --steel:#c9d2ce; --lining:#5b4a3a;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1412; --panel:#151b19; --canvas:#111715; --ink:#e4eae7; --muted:#8f9d97; --line:#2a3430;
  --grid:#18201d; --grid2:#222c28;
  --b1:#ff8a3d; --b1f:rgba(255,138,61,.13); --b2:#c693e6; --b2f:rgba(198,147,230,.13); --geo:#4fcf89; --hot:#ffc24a; --warn:#ff6b5b;
  --accent:#ff8a3d; --accent-ink:#1b1208; --l1:#a3ada8; --l2:#6aaef0; --l3:#4fcf89; --l4:#ff8a3d; --l5:#c693e6; --l6:#4fd1d3;
  --steel:#2c3633; --lining:#a08a72; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#151b19; --canvas:#111715; --ink:#e4eae7; --muted:#8f9d97; --line:#2a3430;
  --grid:#18201d; --grid2:#222c28;
  --b1:#ff8a3d; --b1f:rgba(255,138,61,.13); --b2:#c693e6; --b2f:rgba(198,147,230,.13); --geo:#4fcf89; --hot:#ffc24a; --warn:#ff6b5b;
  --accent:#ff8a3d; --accent-ink:#1b1208; --l1:#a3ada8; --l2:#6aaef0; --l3:#4fcf89; --l4:#ff8a3d; --l5:#c693e6; --l6:#4fd1d3;
  --steel:#2c3633; --lining:#a08a72; color-scheme:dark }

html,body{height:100%;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

.top{display:flex;align-items:stretch;gap:20px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;justify-content:center;padding-block:8px}
.brand b{font-weight:700;font-size:20px;letter-spacing:.14em}
.brand b span{color:var(--accent)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:52px}
.tab .n{font-family:var(--f-mono);font-size:11px;font-weight:400}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hidebtn{all:unset;cursor:pointer;align-self:center;padding:7px 12px;border:1px solid var(--line);border-radius:5px;font-size:13.5px;font-weight:600;white-space:nowrap}
.hidebtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hidebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.work{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.panel{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 16px 20px;display:flex;flex-direction:column;gap:18px;min-height:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0;font-size:14px;color:var(--muted)}
.lead strong{color:var(--ink);font-weight:600}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;text-align:center;padding:7px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.field{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.field label{font-size:14px;font-weight:500}
.field output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.field input[type=range]{grid-column:1/-1;width:100%}
.field.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{background:color-mix(in srgb,var(--accent) 18%,transparent)}}

.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;padding:5px 7px;border:1px solid var(--line);border-radius:5px}
.chk input{accent-color:var(--accent);margin:0}
.chk i{width:10px;height:10px;border-radius:2px;flex:none}

.calc{border:1px solid var(--line);border-radius:6px;background:var(--canvas);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.calc .eq{font-family:var(--f-mono);font-size:12.5px;line-height:1.5;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.calc .eq .v{color:var(--accent)}
.calc .eq.c{color:var(--muted);white-space:normal;font-family:var(--f-ui);font-size:13px}
.state{font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:5px;border:1px solid var(--line)}
.state.ok{color:var(--geo);border-color:color-mix(in srgb,var(--geo) 50%,transparent)}
.state.warn{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 50%,transparent)}
.state.bad{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.pchart{width:100%;height:170px;display:block;border:1px solid var(--line);border-radius:6px;background:var(--canvas)}
.cap{font-size:12.5px;color:var(--muted);margin:0}
table.mat{border-collapse:collapse;width:100%;font-size:13px}
table.mat td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
table.mat td+td{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap}

.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.cvwrap{position:relative;flex:1;min-height:0;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#cv.over{cursor:pointer}
.readout{position:absolute;top:12px;right:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:230px;max-width:46%;pointer-events:none}
.readout dl{margin:0;display:grid;grid-template-columns:auto auto;gap:3px 14px}
.readout dt{font-size:13px;color:var(--muted)}
.readout dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.readout dd.key{color:var(--accent);font-weight:500}
.readout .rt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.hidevals .readout dd,.hidevals .calc .v,.hidevals .state{filter:blur(6px);user-select:none}
.hint{position:absolute;left:12px;top:12px;font-size:12.5px;color:var(--muted);pointer-events:none;max-width:calc(54% - 24px)}
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zoombar button{all:unset;cursor:pointer;min-width:32px;height:32px;display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--ink)}
.zoombar button.txt{font-size:13px;padding:0 10px;border-left:1px solid var(--line)}
.zoombar button:hover{background:var(--bg)}
.zoombar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.zoombar output{font-family:var(--f-mono);font-size:12px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}

.guide{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;align-items:start}
.steps{display:flex;gap:4px;grid-row:span 2}
.steps button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-family:var(--f-mono);font-size:12px}
.steps button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.guide h4{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.guide p{margin:0;font-size:14.5px;max-width:80ch;color:var(--ink)}

.credits{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:11px;line-height:1.45;color:var(--muted)}
.credits b{display:block;font-weight:600}
.credits .d{margin-top:4px}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .work{display:flex;flex-direction:column}
  .stage{order:-1}
  .cvwrap{height:62vh;flex:none}
  .panel{border-right:0;border-top:1px solid var(--line);overflow:visible}
  .readout{position:static;margin:10px 16px 0;min-width:0;max-width:none}
  .hint{display:none}
  .guide{grid-template-columns:1fr}
  .steps{grid-row:auto}
  .tabs{order:3;flex-basis:100%;margin-inline:-16px;padding-inline:8px}
  .top{gap:8px 20px}
  .hidebtn{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){ .field.flash{animation:none} }

/* sliders iguales en todos los navegadores y temas */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0;padding:0}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) 0 var(--fill,0%),var(--line) var(--fill,0%) 100%);border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent);margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line);border:0}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b><span>μ</span>LAB</b><small>Frenos y embragues</small></div>
    <nav class="tabs" role="tablist" aria-label="Módulos">
      <button class="tab" role="tab" data-go="zc"><span class="n">01</span>Zapata corta</button>
      <button class="tab" role="tab" data-go="zl"><span class="n">02</span>Zapatas largas</button>
      <button class="tab" role="tab" data-go="ci"><span class="n">03</span>Freno de cinta</button>
      <button class="tab" role="tab" data-go="em"><span class="n">04</span>Embrague de disco</button>
      <button class="tab" role="tab" data-go="fd"><span class="n">05</span>Freno de disco</button>
      <button class="tab" role="tab" data-go="ca"><span class="n">06</span>Calor y materiales</button>
    </nav>
    <button class="hidebtn" id="hidebtn" aria-pressed="false" title="Oculta los resultados para que la clase los estime antes">Ocultar resultados</button>
  </header>

  <main class="work">
    <aside class="panel" id="panel">
      <div id="ctrls" class="sec" style="gap:18px"></div>
      <div class="credits" aria-label="Créditos">
        <b>Universidad Nacional de San Juan</b>
        Facultad de Ingeniería<br>
        Cátedra Mecanismos
        <div class="d">Ing. Manuel Galdeano Ruiz</div>
      </div>
    </aside>

    <section class="stage">
      <div class="cvwrap">
        <canvas id="cv" aria-label="Esquema del freno o embrague con sus fuerzas"></canvas>
        <div class="hint" id="hint"></div>
        <div class="zoombar" role="group" aria-label="Vista">
          <button id="z-out" aria-label="Alejar">−</button>
          <output id="z-val">100 %</output>
          <button id="z-in" aria-label="Acercar">+</button>
          <button id="z-fit" class="txt">Encuadrar</button>
          <button id="z-play" class="txt" aria-pressed="true">Pausar giro</button>
        </div>
      </div>
      <div class="readout" id="readout"></div>
      <div class="guide" id="guide">
        <div class="steps" id="steps"></div>
        <h4 id="g-title"></h4>
        <p id="g-text"></p>
      </div>
    </section>
  </main>
</div>
<script>
(()=>{
"use strict";
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const DEG = Math.PI/180;

/* ---------------- utilidades ---------------- */
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, crs=(a,b)=>a.x*b.y-a.y*b.x, hyp=a=>Math.hypot(a.x,a.y);
const nrm=a=>{const l=hyp(a)||1;return V(a.x/l,a.y/l);};
const ue=a=>V(Math.cos(a),Math.sin(a)), up=a=>V(-Math.sin(a),Math.cos(a));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=(x,d=2)=>Number.isFinite(x)?x.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const fN=x=>fmt(x,0)+' N', fNm=x=>fmt(x/1000,1)+' N·m', fMPa=x=>fmt(x,3)+' MPa', fkg=x=>fmt(x*10.197,2)+' kgf/cm²';
const rgba=(hex,a)=>{ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- colores (tokens) ---------------- */
const C={};
function readColors(){const cs=getComputedStyle(document.documentElement);
  ['canvas','ink','muted','line','grid','grid2','b1','b1f','b2','b2f','geo','hot','warn','panel','accent','l2','l6','steel','lining'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();draw();});
new MutationObserver(()=>{readColors();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
const FONT=()=>getComputedStyle(document.body).getPropertyValue('--f-mono');

/* ---------------- vista: mundo en mm (y hacia arriba) -> pantalla ---------------- */
const view={s:1,ox:0,oy:0}; const CAMS={};
let base={s:1,c:V(0,0)};
const cam=()=>CAMS[mod]||(CAMS[mod]={z:1,pan:V(0,0)});
function fit(b){ const pad=34, k=cam();
  const wide=W>860, top=wide?40:20, rw=wide?Math.min(270,W*.24):0; // lugar para la lectura (arriba a la derecha)
  const aw=W-rw; base.s=Math.min((aw-2*pad)/(b[2]-b[0]),(H-pad-top)/(b[3]-b[1])); base.c=V((b[0]+b[2])/2,(b[1]+b[3])/2);
  view.s=base.s*k.z; const c=add(base.c,k.pan);
  view.ox=aw/2-view.s*c.x; view.oy=(H+top-pad)/2+view.s*c.y; }
const S=p=>V(view.ox+view.s*p.x, view.oy-view.s*p.y);
const toW=q=>V((q.x-view.ox)/view.s, (view.oy-q.y)/view.s);
function zoomAt(q,f){ const k=cam(), z2=clamp(k.z*f,.4,20); if(z2===k.z) return;
  const m=toW(q); k.z=z2; fit(M().bbox(st())); const m2=toW(q); k.pan=add(k.pan,sub(m,m2)); syncZoom(); draw(); }
function syncZoom(){ $('#z-val').textContent=Math.round(cam().z*100)+' %'; }

function resize(){ const r=cv.getBoundingClientRect(); DPR=window.devicePixelRatio||1; W=r.width; H=r.height;
  cv.width=Math.max(1,Math.round(W*DPR)); cv.height=Math.max(1,Math.round(H*DPR)); draw(); }
new ResizeObserver(resize).observe(cv.parentElement);

/* ---------------- primitivas de dibujo ---------------- */
function clear(){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle=C.canvas; ctx.fillRect(0,0,W,H); }
function grid(){ const a=toW(V(0,H)), b=toW(V(W,0));
  for(const [step,col] of [[10,C.grid],[50,C.grid2]]){ if(step*view.s<6) continue;
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath();
    for(let x=Math.ceil(a.x/step)*step;x<=b.x;x+=step){const X=Math.round(S(V(x,0)).x)+.5;ctx.moveTo(X,0);ctx.lineTo(X,H);}
    for(let y=Math.ceil(a.y/step)*step;y<=b.y;y+=step){const Y=Math.round(S(V(0,y)).y)+.5;ctx.moveTo(0,Y);ctx.lineTo(W,Y);}
    ctx.stroke(); }
  const mm=[5,10,20,50,100,200,500].find(v=>v*view.s>=60)||500, L=mm*view.s, x=16, y=H-18;
  ctx.strokeStyle=C.muted; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+L,y); ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.moveTo(x+L,y-4);ctx.lineTo(x+L,y+4); ctx.stroke();
  label(mm+' mm',V(x+L+6,y),C.muted,'left',true); }
function path(pts,{stroke=null,w=1,fill=null,dash=null,close=false}={}){ if(pts.length<2) return; ctx.save(); if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); pts.forEach((p,i)=>{const P=S(p); i?ctx.lineTo(P.x,P.y):ctx.moveTo(P.x,P.y);}); if(close) ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.lineJoin='round';ctx.stroke();} ctx.restore(); }
const line=(a,b,col,w=1,dash=null)=>path([a,b],{stroke:col,w,dash});
function circle(c,r,stroke,w=1,fill=null,dash=null){ const P=S(c); ctx.save(); if(dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.arc(P.x,P.y,Math.max(0,r*view.s),0,2*Math.PI);
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();} ctx.restore(); }
const arcPts=(c,r,a0,a1,n=64)=>{const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push(add(c,mul(ue(a),r)));}return p;};
const rotAbout=(p,c,d)=>{ const q=sub(p,c), co=Math.cos(d), sn=Math.sin(d); return add(c,V(q.x*co-q.y*sn,q.x*sn+q.y*co)); };
function bandT(c,r0,r1,a0,a1,fill,stroke,T){ const o=arcPts(c,r1,a0,a1), i=arcPts(c,r0,a1,a0); path(o.concat(i).map(T),{fill,stroke,w:1.2,close:true}); }
function band(c,r0,r1,a0,a1,fill,stroke){ const o=arcPts(c,r1,a0,a1), i=arcPts(c,r0,a1,a0); path(o.concat(i),{fill,stroke,w:1.2,close:true}); }
function label(t,p,col,align='left',screen=false,dx=0,dy=0,size=12){ const P=screen?p:S(p); ctx.save(); ctx.font=`500 ${size}px ${FONT()}`;
  ctx.textAlign=align; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.strokeStyle=C.canvas; ctx.lineWidth=4; ctx.strokeText(t,P.x+dx,P.y+dy); ctx.fillStyle=col; ctx.fillText(t,P.x+dx,P.y+dy); ctx.restore(); }
/* flecha: punto en mundo, dirección en mundo, largo en px. tip=true -> la punta queda en el punto */
function arrow(p,dir,len,col,txt,{tip=false,w=2.4}={}){ if(!(len>2)) return; const d0=nrm(dir), d=V(d0.x,-d0.y); let A=S(p), B=add(A,mul(d,len)); if(tip){B=A;A=sub(B,mul(d,len));}
  const n=V(-d.y,d.x), h=Math.min(11,len*.45);
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x-d.x*h*.7,B.y-d.y*h*.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(B.x-d.x*h+n.x*h*.45,B.y-d.y*h+n.y*h*.45); ctx.lineTo(B.x-d.x*h-n.x*h*.45,B.y-d.y*h-n.y*h*.45); ctx.closePath(); ctx.fill(); ctx.restore();
  if(txt){ const q=tip?A:B; label(txt,add(q,mul(d,tip?-13:13)),col,'center',true); } }
/* flecha curva (giro o cupla): centro, radio en px, ángulo inicial y barrido (rad, + antihorario) */
function curl(c,Rpx,a0,sw,col,txt){ const P=S(c); ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2.2; ctx.beginPath();
  ctx.arc(P.x,P.y,Rpx,-a0,-(a0+sw),sw>0); ctx.stroke();
  const ae=a0+sw, E=add(P,V(Math.cos(ae)*Rpx,-Math.sin(ae)*Rpx)), t=V(-Math.sin(ae)*Math.sign(sw),-Math.cos(ae)*Math.sign(sw)), n=V(-t.y,t.x);
  ctx.beginPath(); ctx.moveTo(E.x+t.x*9,E.y+t.y*9); ctx.lineTo(E.x+n.x*4.5,E.y+n.y*4.5); ctx.lineTo(E.x-n.x*4.5,E.y-n.y*4.5); ctx.closePath(); ctx.fill(); ctx.restore();
  if(txt){ const am=a0+sw/2; label(txt,add(P,V(Math.cos(am)*(Rpx+14),-Math.sin(am)*(Rpx+14))),col,'center',true); } }
function dotp(c,rad,col){ const P=S(c); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(P.x,P.y,rad,0,2*Math.PI); ctx.fill(); }
function pin(p,col){ const P=S(p); ctx.save(); ctx.beginPath(); ctx.arc(P.x,P.y,6,0,7); ctx.fillStyle=C.panel; ctx.fill(); ctx.strokeStyle=col||C.ink; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
function ground(p,ang=-Math.PI/2){ // apoyo fijo: triángulo + rayado, ang = dirección hacia el suelo (mundo)
  const d=ue(ang), n=V(-d.y,d.x), P=S(p), D=V(d.x,-d.y), N=V(n.x,-n.y);
  ctx.save(); ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(P.x,P.y); ctx.lineTo(P.x+D.x*18+N.x*12,P.y+D.y*18+N.y*12); ctx.lineTo(P.x+D.x*18-N.x*12,P.y+D.y*18-N.y*12); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); for(let i=-14;i<=12;i+=6){const Q=V(P.x+D.x*18+N.x*i,P.y+D.y*18+N.y*i); ctx.moveTo(Q.x,Q.y); ctx.lineTo(Q.x+D.x*7+N.x*5,Q.y+D.y*7+N.y*5);} ctx.stroke(); ctx.restore(); pin(p); }
function head(P,d,col){ const n=V(-d.y,d.x); ctx.beginPath(); ctx.moveTo(P.x,P.y); ctx.lineTo(P.x-d.x*9+n.x*3.5,P.y-d.y*9+n.y*3.5); ctx.lineTo(P.x-d.x*9-n.x*3.5,P.y-d.y*9-n.y*3.5); ctx.closePath(); ctx.fill(); }
/* cota entre a y b (mundo), corrida off px (+ a la izquierda de a→b). ea / eb: puntos desde donde salen las líneas de referencia */
function dim(a,b,off,txt,col,ea,eb){ col=col||C.muted; const d=nrm(sub(b,a)), n=V(-d.y,d.x), o=mul(n,off/view.s), A=add(a,o), B=add(b,o);
  const SA=S(A), SB=S(B), D=nrm(sub(SB,SA)), N=V(-D.y,D.x), L=hyp(sub(SB,SA));
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=.9;
  for(const [from,to] of [[ea||a,A],[eb||b,B]]){ const F=S(from), T=S(to), u=nrm(sub(T,F)), l=hyp(sub(T,F)); if(l<3) continue;
    ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(F.x+u.x*3,F.y+u.y*3); ctx.lineTo(T.x+u.x*6,T.y+u.y*6); ctx.stroke(); }
  ctx.setLineDash([]); ctx.lineWidth=1.1;
  if(L>26){ ctx.beginPath(); ctx.moveTo(SA.x,SA.y); ctx.lineTo(SB.x,SB.y); ctx.stroke(); head(SB,D,col); head(SA,mul(D,-1),col); }
  else { ctx.beginPath(); ctx.moveTo(SA.x-D.x*16,SA.y-D.y*16); ctx.lineTo(SB.x+D.x*16,SB.y+D.y*16); ctx.stroke(); head(SA,D,col); head(SB,mul(D,-1),col); }
  ctx.restore();
  if(txt){ const M=V((SA.x+SB.x)/2,(SA.y+SB.y)/2); const side=off>=0?-1:1; label(txt,V(M.x+N.x*11*(off>=0?1:-1)*-1,M.y+N.y*11*(off>=0?1:-1)*-1),col,'center',true); } }
function drum(c,r,phi,{ring=0,fill=null,holes=6}={}){ // tambor/disco con marcas que giran
  if(ring>0){ band(c,r,r+ring,0,2*Math.PI,C.steel,C.ink); circle(c,r*.32,C.ink,1.4,C.steel); }
  else circle(c,r,C.ink,1.6,fill||C.steel);
  for(let i=0;i<holes;i++){ const q=add(c,mul(ue(phi+i*2*Math.PI/holes),r*(ring>0?.2:.62))); circle(q,r*(ring>0?.035:.07),C.muted,1,C.canvas); }
  circle(c,r*.12,C.ink,1.2,C.canvas); const P=S(c); ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(P.x-7,P.y);ctx.lineTo(P.x+7,P.y);ctx.moveTo(P.x,P.y-7);ctx.lineTo(P.x,P.y+7);ctx.stroke(); }
function spring(a,b,col){ const d=sub(b,a), L=hyp(d), u=mul(d,1/L), n=V(-u.y,u.x), pts=[a]; const k=10, amp=L*.06;
  for(let i=1;i<k;i++) pts.push(add(add(a,mul(u,L*(.15+.7*i/k))),mul(n,(i%2?1:-1)*amp))); pts.push(b); path(pts,{stroke:col,w:1.3}); }

function chart(id,{xs,series,xr,yr,xl,yl,shade,marks=[],xt=[]}){ const c=document.getElementById(id); if(!c) return; const r=c.getBoundingClientRect(); const d=window.devicePixelRatio||1;
  c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
  const w=r.width, h=r.height, L=38, R=10, T=12, B=28; const X=x=>L+(x-xr[0])/(xr[1]-xr[0])*(w-L-R), Y=y=>h-B-(y-yr[0])/(yr[1]-yr[0])*(h-T-B);
  g.fillStyle=C.canvas; g.fillRect(0,0,w,h); g.font=`11px ${FONT()}`; g.fillStyle=C.muted; g.strokeStyle=C.line; g.lineWidth=1;

  g.textAlign='center'; g.textBaseline='top'; (xt.length?xt:[xr[0],(xr[0]+xr[1])/2,xr[1]]).forEach(x=>g.fillText(typeof x==='number'?fmt(x,0):x[1],X(typeof x==='number'?x:x[0]),h-B+5));

  marks.forEach(m=>{ g.fillStyle=m.col; g.beginPath(); g.arc(X(m.x),Y(m.y),4,0,7); g.fill(); if(m.t){g.textAlign='left';g.textBaseline='bottom';g.fillText(m.t,X(m.x)+6,Y(m.y)-3);} });
  g.fillStyle=C.muted; g.textAlign='left'; g.textBaseline='top'; g.fillText(yl,L+4,1); g.textAlign='right'; g.textBaseline='bottom'; g.fillText(xl,w-R,h-1); }

/* ---------- 01 · ZAPATA CORTA ---------- */
const ZC={
  title:'Zapata corta (elemental)',
  hint:'Arrastrá el pivote O para cambiar los brazos a y b',
  def:{rot:'cw',r:150,a:60,b:300,mu:.35,F:400,A:2500,dcl:true},
  ui:[
    {h:'Sentido de giro del tambor',items:[{t:'seg',k:'rot',opts:ROT}]},
    {h:'Geometría',items:[
      {t:'range',k:'r',l:'Radio del tambor r',min:60,max:300,step:5,u:'mm'},
      {t:'range',k:'a',l:'Brazo de la fricción a',min:0,max:250,step:1,u:'mm'},
      {t:'range',k:'b',l:'Brazo de F y N b',min:40,max:700,step:5,u:'mm'}]},
    {h:'Material y carga',items:[
      {t:'range',k:'mu',l:'Coeficiente de fricción μ',min:.1,max:.7,step:.01,d:2},
      {t:'range',k:'F',l:'Fuerza exterior F',min:20,max:2000,step:10,u:'N'},
      {t:'range',k:'A',l:'Área de la zapata A',min:500,max:8000,step:100,u:'mm²'},
      {t:'chk',k:'dcl',l:'Diagrama de cuerpo libre'}]},
    {h:'Cálculo',items:[{t:'state'},{t:'calc'}]}],
  compute(s){ const sg=s.rot==='cw'?1:-1, den=s.b-sg*s.mu*s.a, lock=den<=0;
    const N=lock?NaN:s.F*s.b/den, Ff=s.mu*N, T=Ff*s.r, Pa=N/s.A, Rx=-sg*Ff, Ry=s.F-N;
    return {sg,den,lock,N,Ff,T,Pa,Rx,Ry,ener:sg>0,muLock:s.b/s.a}; },
  bbox(s){ return [-1.3*s.r, -1.25*s.r, Math.max(s.b,.6*s.r)+.45*s.r, s.r+Math.max(s.a,.4*s.r)+.55*s.r]; },
  draw(s,R){ const r=s.r, hl=.045*r, hs=.08*r, ws=.34*r, yT=r+hl+hs, P=V(s.b,r+s.a), Cp=V(0,r);
    const kind=R.lock?'lock':(R.ener?'ok':'no'), col=KCOL(kind);
    drum(V(0,0),r,phi);
    curl(V(0,0),Math.min(80,r*view.s*.5),1.55*Math.PI,(s.rot==='cw'?-1:1)*.55*Math.PI,C.muted,R.lock?'ω → 0':'ω');
    // despegue: si no es autoenergizante la fricción tiende a separar la zapata (giro leve alrededor de O, exagerado)
    const gap=kind==='no'?(5+2.5*Math.sin(phi*6))/view.s:0, del=-gap/Math.max(s.b,1);
    const T=p=>{ const q=sub(p,P), c=Math.cos(del), sn=Math.sin(del); return add(P,V(q.x*c-q.y*sn,q.x*sn+q.y*c)); };
    path([V(-ws/2,r),V(ws/2,r),V(ws/2,r+hl),V(-ws/2,r+hl)].map(T),{fill:C.lining,close:true});
    path([V(-ws/2,r+hl),V(ws/2,r+hl),V(ws/2,yT),V(-ws/2,yT)].map(T),{fill:rgba(col,.55),stroke:col,w:2,close:true});
    path([T(V(0,yT)),P],{stroke:C.ink,w:5}); path([T(V(0,yT)),P],{stroke:C.steel,w:2.6});
    ground(P,Math.PI/2.6);
    label('O',P,C.ink,'left',false,10,-14);
    const msg=kind==='lock'?'autoblocante: el tambor queda frenado':(kind==='ok'?'la fricción arrastra la zapata contra el tambor':'la fricción tiende a despegar la zapata');
    label(msg,V(12,104),col,'left',true,0,0,12.5);
    // cotas desde el pivote O hasta el punto de contacto zapata–tambor
    const yb=Math.max(P.y,yT+.08*r);
    dim(V(0,yb),V(s.b,yb),30,'b',null,Cp,P);
    if(Math.abs(s.a)>.5) dim(V(s.b,r),V(s.b,r+s.a),-34,'a',null,Cp,P);
    dotp(Cp,3.5,C.ink);

    const k=forceScale([s.F,R.N||s.F,R.Ff||0,R.Rx||0,R.Ry||0]);
    arrow(T(V(0,yT)),V(0,-1),s.F*k,C.b1,'F',{tip:true});
    if(!R.lock){
      arrow(Cp,V(0,1),R.N*k,C.l2,'N',{tip:true});
      arrow(Cp,V(R.sg,0),R.Ff*k,C.b2,'μN');
      if(Math.abs(R.Rx)*k>3) arrow(P,V(Math.sign(R.Rx),0),Math.abs(R.Rx)*k,C.geo,'Rx');
      if(Math.abs(R.Ry)*k>3) arrow(P,V(0,Math.sign(R.Ry)),Math.abs(R.Ry)*k,C.geo,'Ry');
      curl(V(0,0),Math.min(48,r*view.s*.3),.05*Math.PI,(s.rot==='cw'?1:-1)*.5*Math.PI,C.warn,'T');
    }
    legend(); },
  stopped:(s,R)=>R.lock,
  handles(s){ return [{p:V(s.b,s.r+s.a),set:w=>{s.b=clamp(Math.round(w.x/5)*5,40,700); s.a=clamp(Math.round(w.y-s.r),0,250);}}]; },
  readout(s,R){ return R.lock?[['Condición','AUTOBLOCANTE',1],['μ·a',fmt(s.mu*s.a,1)+' mm'],['b',fmt(s.b,0)+' mm']]:
    [['Normal N',fN(R.N),1],['Fricción μN',fN(R.Ff)],['Cupla de frenado T',fNm(R.T),1],['Presión Pa = N/A',fMPa(R.Pa)],['',fkg(R.Pa)],['Reacción Rx',fN(Math.abs(R.Rx))],['Reacción Ry',fN(Math.abs(R.Ry))],['N / F',fmt(R.N/s.F,2)]]; },
  state(s,R){ if(R.lock) return ['bad','Autoblocante: b ≤ μ·a. El freno se aplica solo, sin fuerza exterior.'];

  calc(s,R){ const sg=R.sg>0?'+':'−', sg2=R.sg>0?'−':'+';

      `N = F·b / (b ${sg2} μ·a) = <span class="v">${fmt(s.F,0)}·${fmt(s.b,0)} / (${fmt(s.b,0)} ${sg2} ${fmt(s.mu,2)}·${fmt(s.a,0)})</span>`,
      `N = <span class="v">${R.lock?'— (autoblocante)':fN(R.N)}</span>`,
      `T = μ·N·r = <span class="v">${R.lock?'—':fmt(s.mu,2)+'·'+fmt(R.N,0)+'·'+fmt(s.r,0)+' = '+fNm(R.T)}</span>`,
      `Rx = μ·N = <span class="v">${R.lock?'—':fN(Math.abs(R.Rx))}</span>   Ry = N − F = <span class="v">${R.lock?'—':fmt(-R.Ry,0)+' N'}</span>`]; },
  steps:[
    {t:'¿Quién ayuda a quién?',p:'Con el tambor girando en sentido horario, compará N con F. ¿Por qué N resulta mayor que la fuerza que aplicamos? Mirá el momento de μN respecto de O.',set:{rot:'cw',a:60,b:300,mu:.35,F:400}},
    {t:'Mismo freno, otro sentido',p:'Invertí el giro sin tocar nada más. ¿Cambia la fórmula de la cupla T = μ·N·r? ¿Qué pasa con la fuerza F necesaria para obtener la misma N?',set:{rot:'ccw'}},
    {t:'Autoblocante',p:'Con giro horario, el pivote quedó cerca de la zapata (b chico) y lejos de la línea de fricción (a grande): b ≤ μ·a. La zapata se pone roja y el tambor se frena solo. ¿Qué significa que no haga falta fuerza exterior? Mové b para salir del autobloqueo.',set:{rot:'cw',a:220,b:70},flash:'b'},
    {t:'Criterio de diseño',p:'Buscá una geometría que sea autoenergizante pero quede lejos del autobloqueo aunque μ aumente un 50 %. ¿Qué relación b/a elegirías?',set:{rot:'cw',a:60,b:180,mu:.35},flash:'mu'}]
};

/* ---------- 02 · ZAPATAS LARGAS (una, Simplex, Duplex) ---------- */
function shoeCalc(g){ // g: {r,a,phiA,k,th1,th2,int,rot,mu,Pa,b}
  const t1=g.th1*DEG, t2=g.th2*DEG, thA=(t1<=Math.PI/2&&t2>=Math.PI/2)?Math.PI/2:(Math.sin(t1)>Math.sin(t2)?t1:t2);
  const Cc=g.Pa*g.b*g.r/Math.sin(thA), Ap=mul(ue(g.phiA*DEG),g.a);
  let sN=V(0,0), sf=V(0,0), Mn=0, Mf=0, Ns=0; const n=240, dt=(t2-t1)/n;
  for(let i=0;i<n;i++){ const th=t1+(i+.5)*dt, ph=g.phiA*DEG+g.k*th, M=mul(ue(ph),g.r), dN=Cc*Math.sin(th)*dt;
    const nh=g.int?mul(ue(ph),-1):ue(ph), f=mul(up(ph),g.rot*g.mu*dN);
    sN=add(sN,mul(nh,dN)); sf=add(sf,f); Mn+=crs(sub(M,Ap),nh)*dN; Mf+=crs(sub(M,Ap),f); Ns+=dN; }
  const toe=mul(ue(g.phiA*DEG+g.k*t2),g.r), heel=mul(ue(g.phiA*DEG+g.k*t1),g.r), AP=sub(toe,Ap);
  // F actúa en el extremo de la zapata, tangente al tambor (perpendicular al radio O–extremo): dirección fija respecto de la zapata
  let dirF=up(g.phiA*DEG+g.k*t2); if(crs(AP,dirF)*Mn>0) dirF=mul(dirF,-1);
  const d=Math.abs(crs(AP,dirF)), foot=add(toe,mul(dirF,-dot(AP,dirF)));
  const F=(Mn+Mf)/(d*Math.sign(Mn)), ener=Mf*Mn<0, lock=F<=0;
  const R=mul(add(add(sN,sf),mul(dirF,F)),-1), T=g.mu*g.r*Ns;
  const As=.5*(t2-t1)-.25*(Math.sin(2*t2)-Math.sin(2*t1)), Bs=.5*(Math.sin(t2)**2-Math.sin(t1)**2), Ck=Math.cos(t1)-Math.cos(t2);
  return {thA,C:Cc,A:Ap,toe,heel,d,foot,dirF,F,ener,lock,R,T,Mn:Math.abs(Mn),Mf:Math.abs(Mf),As,Bs,Ck,
    MnA:Cc*g.a*As, MfA:Cc*g.mu*(g.r*Ck-g.a*Bs), TA:Cc*g.mu*g.r*Ck, muLock:g.mu*Math.abs(Mn)/Math.abs(Mf), g};
}

/* ---------- detalle ampliado de un punto M de la zapata (como un detalle de plano) ---------- */
function zlDetail(s,R){ const z=R.sh[0], g=z.g, r=s.r, int=s.tipo==='int', th=clamp(s.thM,g.th1,g.th2)*DEG;
  const M=mul(ue(th),r), A=z.A, AM=sub(M,A), e=hyp(AM), into=int?ue(th):mul(ue(th),-1), tan=V(-into.y,into.x);

/* ---------- 03 · FRENO DE CINTA ---------- */
function bandGeo(s){ const r=s.r, al=s.al*DEG, beta=(2*Math.PI-al)/2;
  const TL=mul(ue(-Math.PI/2-beta),r), TR=mul(ue(-Math.PI/2+beta),r);
  const dL=up(-Math.PI/2-beta), dR=mul(up(-Math.PI/2+beta),-1); // direcciones de los ramales hacia abajo
  // A a distancia b del ramal izquierdo y a del ramal derecho (dentro de la V)
  const nL=V(-dL.y,dL.x), nR=V(dR.y,-dR.x); // normales hacia adentro de la V
  const pL=add(TL,mul(nL,s.modo==='dif'?s.b:0)), pR=add(TR,mul(nR,s.a));
  const den=crs(dL,dR); if(Math.abs(den)<1e-9) return null;
  const t=crs(sub(pR,pL),dR)/den, A=add(pL,mul(dL,t));
  const QL=s.modo==='dif'?add(A,mul(nL,-s.b)):A, QR=add(A,mul(nR,-s.a));
  const ok=dot(sub(QL,TL),dL)>0&&dot(sub(QR,TR),dR)>0;
  const uL=nrm(sub(TL,QL)), uR=nrm(sub(TR,QR)); // tensión sobre la palanca: hacia el tambor
  const mL=crs(sub(QL,A),uL), mR=crs(sub(QR,A),uR), mW=-s.c; // momentos por unidad (antihorario +)
  return {TL,TR,dL,dR,A,QL,QR,uL,uR,mL,mR,mW,ok,beta}; }
const CI={
  title:'Freno de cinta',
  hint:'',
  def:{modo:'simple',rot:'cw',r:200,al:270,mu:.25,W:150,c:700,a:90,b:40,w:50,t:3,sadm:70},
  ui:[
    {h:'Tipo de freno',items:[{t:'seg',k:'modo',opts:[['simple','Simple'],['dif','Diferencial']]}]},
    {h:'Sentido de giro del tambor',items:[{t:'seg',k:'rot',opts:ROT}]},
    {h:'Geometría',items:[
      {t:'range',k:'r',l:'Radio del tambor r',min:100,max:350,step:5,u:'mm'},
      {t:'range',k:'al',l:'Ángulo de abrace α',min:200,max:320,step:1,u:'°'},
      {t:'range',k:'a',l:'Brazo a (ramal derecho)',min:20,max:200,step:1,u:'mm'},
      {t:'range',k:'b',l:'Brazo b (ramal izquierdo)',min:5,max:200,step:1,u:'mm',when:s=>s.modo==='dif'},
      {t:'range',k:'c',l:'Brazo de la fuerza W, c',min:200,max:1200,step:10,u:'mm'}]},
    {h:'Material y carga',items:[
      {t:'range',k:'mu',l:'Coeficiente de fricción μ',min:.1,max:.5,step:.01,d:2},
      {t:'range',k:'W',l:'Fuerza en la palanca W',min:10,max:600,step:5,u:'N'},
      {t:'range',k:'w',l:'Ancho de la cinta',min:20,max:150,step:1,u:'mm'},
      {t:'range',k:'t',l:'Espesor de la cinta t',min:1,max:8,step:.5,u:'mm',d:1},
      {t:'range',k:'sadm',l:'Tensión admisible σadm',min:30,max:200,step:5,u:'MPa'}]},
    {h:'Tensión a lo largo de la cinta',items:[{t:'chart',id:'chCI'},{t:'note',x:'Teorema de Prony: F₁/F₂ = e^(μ·α). La presión sobre el tambor es proporcional a la tensión: P = F/(b·r).'}]},
    {h:'Cálculo',items:[{t:'state'},{t:'calc'}]}],
  compute(s){ const G=bandGeo(s), e=Math.exp(s.mu*s.al*DEG);
    if(!G) return {bad:true,e};
    const leftTight=s.rot==='cw'; // el ramal tenso es el que "recibe" la superficie del tambor
    const mT=leftTight?G.mL:G.mR, mS=leftTight?G.mR:G.mL;
    const den=mS+e*mT, F2=-s.W*G.mW/den, lock=!(F2>0)||!Number.isFinite(F2);
    const F1=e*F2, Fu=F1-F2, T=Fu*s.r, Pa=F1/(s.w*s.r), sig=F1/(s.w*s.t);
    return {G,e,leftTight,F1,F2,Fu,T,Pa,sig,lock,mT,mS}; },
  bbox(s){ const G=bandGeo(s), r=s.r; let x0=-1.2*r, x1=1.2*r, y0=-1.5*r, y1=1.15*r;
    if(G){ x1=Math.max(x1,G.A.x+s.c+.15*r); y0=Math.min(y0,G.A.y-.25*r,G.QL.y-.2*r,G.QR.y-.2*r,-1.12*r-.3*r); } return [x0,y0,x1,y1]; },
  draw(s,R){ const r=s.r; drum(V(0,0),r,phi);
    curl(V(0,0),Math.min(70,r*.35*view.s),.6*Math.PI,rotSign(s)*.5*Math.PI,C.muted,'ω');
    if(R.bad||!R.G) return; const G=R.G, tb=Math.max(2,s.t*3);
    // cinta sobre el tambor con espesor proporcional a la tensión
    const a0=-Math.PI/2-G.beta, a1=-Math.PI/2+G.beta-2*Math.PI; // recorre la parte superior
    const n=60, Fmax=R.lock?1:R.F1;
    for(let i=0;i<n;i++){ const t0=a0+(a1-a0)*i/n, t1=a0+(a1-a0)*(i+1)/n; const fr=R.leftTight?i/n:1-i/n;
      const F=R.lock?1:(R.leftTight? R.F1*Math.exp(-s.mu*s.al*DEG*fr) : R.F2*Math.exp(s.mu*s.al*DEG*fr));
      const th=(1.5+5*F/Fmax)/view.s; band(V(0,0),r,r+th+tb/view.s*.3,Math.min(t0,t1),Math.max(t0,t1),C.lining,null); }
    // presiones (radiales)
    if(!R.lock) for(let i=1;i<12;i++){ const fr=i/12, ang=a0+(a1-a0)*fr; const F=R.leftTight?R.F1*Math.exp(-s.mu*s.al*DEG*fr):R.F2*Math.exp(s.mu*s.al*DEG*fr);
      const L=40*F/R.F1, Mp=mul(ue(ang),r+6/view.s); arrow(add(Mp,mul(ue(ang),L/view.s)),mul(ue(ang),-1),L,C.hot,null,{w:1.4}); }
    // ramales
    path([G.TL,G.QL],{stroke:C.lining,w:3}); path([G.TR,G.QR],{stroke:C.lining,w:3});
    // palanca
    const yl=Math.min(G.A.y,-1.12*r,G.QR.y-.04*r), K=V(G.A.x,yl), E=V(G.A.x+s.c,yl); // palanca acodada: el brazo de W sigue siendo c
    const lev=yl<G.A.y-1?[G.A,K,E]:[G.A,E];
    path(lev,{stroke:C.ink,w:6}); path(lev,{stroke:C.steel,w:3.4});
    for(const q of [G.QL,G.QR]) if(hyp(sub(q,G.A))>1){ path([G.A,q],{stroke:C.ink,w:6}); path([G.A,q],{stroke:C.steel,w:3.4}); }
    ground(G.A,Math.PI/2); pin(G.QR); if(s.modo==='dif') pin(G.QL); label('A',G.A,C.ink,'right',false,-10,-12);
    dim(V(G.A.x,yl),E,-34,'c'); if(s.modo==='dif') dim(G.A,G.QL,10,'b'); dim(G.A,G.QR,-10,'a');
    if(R.lock){ arrow(E,V(0,-1),70,C.b1,'W',{tip:true}); return; }
    const k=forceScale([R.F1,R.F2,s.W],120);
    const tL=R.leftTight?R.F1:R.F2, tR=R.leftTight?R.F2:R.F1;
    arrow(G.QL,G.uL,tL*k,C.l2,R.leftTight?'F₁':'F₂'); arrow(G.QR,G.uR,tR*k,C.l2,R.leftTight?'F₂':'F₁');
    arrow(E,V(0,-1),Math.max(30,s.W*k),C.b1,'W',{tip:true});
    label(R.leftTight?'ramal tenso':'ramal flojo',G.TL,C.muted,'right',false,-12,0,11); label(R.leftTight?'ramal flojo':'ramal tenso',G.TR,C.muted,'left',false,12,0,11);
    curl(V(0,0),Math.min(40,r*.2*view.s),-.3*Math.PI,-rotSign(s)*.6*Math.PI,C.warn,'T'); },
  stopped:(s,R)=>!!R.lock,
  handles(){ return []; },
  readout(s,R){ if(R.bad||!R.G) return [['Geometría','no válida',1]]; if(R.lock) return [['Condición','AUTOBLOCANTE',1],['e^(μα)',fmt(R.e,3)]];
    return [['Ramal tenso F₁',fN(R.F1),1],['Ramal flojo F₂',fN(R.F2)],['e^(μα)',fmt(R.e,3)],['Fuerza útil Fu',fN(R.Fu)],['Cupla de frenado T',fNm(R.T),1],['Presión máx. Pa',fMPa(R.Pa)],['Tensión en la cinta',fmt(R.sig,1)+' MPa']]; },
  state(s,R){ if(R.bad||!R.G||!R.G.ok) return ['bad','La geometría no es válida: achicá los brazos a y b o cambiá el ángulo de abrace.'];
    if(R.lock) return ['bad', s.modo==='dif'?'Autoblocante: el momento del ramal que colabora con W supera al otro. El freno se aplica solo en este sentido de giro.':'Sin solución con W hacia abajo.'];
    if(R.sig>s.sadm) return ['bad',`La cinta está sobrecargada: σ = F₁/(b·t) = ${fmt(R.sig,1)} MPa > σadm.`];
    const tightLever=s.modo==='simple'&&!R.leftTight;
    if(s.modo==='simple') return [tightLever?'warn':'ok', tightLever?'La palanca tira del ramal tenso: hace falta más W para la misma cupla.':'La palanca tira del ramal flojo: es el sentido más eficiente.'];
    return [R.mS*R.mT<0?'ok':'warn', `Freno diferencial: el ramal ${R.leftTight?'flojo (derecho)':'flojo (izquierdo)'} ${(R.leftTight?R.G.mR:R.G.mL)*R.G.mW>0?'colabora con W: autoenergizante':'se opone a W'}.`]; },
  calc(s,R){ if(R.bad||!R.G) return ['—'];
    const G=R.G, b=s.modo==='dif'?s.b:0;
    const out=[`e^(μ·α) = e^(${fmt(s.mu,2)}·${fmt(s.al*DEG,3)}) = <span class="v">${fmt(R.e,3)}</span>`];
    if(s.modo==='simple'){ out.push(`ΣM<sub>A</sub> = W·c − F<sub>palanca</sub>·a = 0 → F<sub>palanca</sub> = W·c/a = <span class="v">${fN(s.W*s.c/s.a)}</span> (${R.leftTight?'ramal flojo F₂':'ramal tenso F₁'})`); }
    else if(!R.leftTight){ out.push(`ΣM<sub>A</sub> = W·c + F₂·b − F₁·a = 0`); out.push(`W = Fu·(a·e^(μα) − b) / [c·(e^(μα) − 1)]`); out.push(`a·e^(μα) = <span class="v">${fmt(s.a*R.e,1)} mm</span>  vs  b = <span class="v">${fmt(b,0)} mm</span> → ${b>=s.a*R.e?'autoblocante':'controlable'}`); }
    else { out.push(`ΣM<sub>A</sub> = W·c + F₁·b − F₂·a = 0 (giro invertido: el ramal tenso es el de b)`); out.push(`a = <span class="v">${fmt(s.a,0)} mm</span>  vs  b·e^(μα) = <span class="v">${fmt(b*R.e,1)} mm</span> → ${s.a<=b*R.e?'autoblocante':'controlable'}`); }
    if(!R.lock){ out.push(`F₁ = <span class="v">${fN(R.F1)}</span>, F₂ = F₁/e^(μα) = <span class="v">${fN(R.F2)}</span>`);
      out.push(`T = (F₁ − F₂)·r = <span class="v">${fNm(R.T)}</span>`); out.push(`Pa = F₁/(b·r) = <span class="v">${fMPa(R.Pa)}</span>   σ = F₁/(b·t) = <span class="v">${fmt(R.sig,1)} MPa</span>`); }
    return out; },
  charts(s,R){ if(R.bad||R.lock) { chart('chCI',{xs:[0,1],series:[],xr:[0,s.al],yr:[0,1],xl:'φ [°]',yl:'F [N]'}); return; }
    const xs=[], ys=[]; for(let a=0;a<=s.al;a+=3){xs.push(a); ys.push(R.F2*Math.exp(s.mu*a*DEG));}
    chart('chCI',{xs,series:[{ys,col:C.l2,w:2.5}],xr:[0,s.al],yr:[0,Math.ceil(R.F1*1.1/50)*50||1],xl:'φ desde el ramal flojo [°]',yl:'F [N]',
      marks:[{x:0,y:R.F2,col:C.l2,t:'F₂'},{x:s.al,y:R.F1,col:C.l2,t:'F₁'}],xt:[0,90,180,270].filter(x=>x<=s.al).concat([s.al])}); },
  steps:[
    {t:'Teorema de Prony',p:'La tensión crece a lo largo del abrace desde F₂ hasta F₁ = F₂·e^(μα). Mirá el gráfico y el espesor de la cinta en el dibujo. ¿Dónde está la presión máxima sobre el tambor?',set:{modo:'simple',rot:'cw',al:270,mu:.25}},
    {t:'Ángulo de abrace',p:'Aumentá α de 200° a 320°. ¿Cómo cambia la relación F₁/F₂ y la cupla para la misma W?',set:{al:200},flash:'al'},

};

const EM={
  title:'Embrague de disco',
  hint:'Arrastrá los bordes del forro para cambiar r₁ y r₂',
  def:{hip:'des',r1:60,r2:110,mu:.3,i:2,F:4000,Padm:.5},
  ui:[
    {h:'Hipótesis',items:[{t:'seg',k:'hip',opts:[['pre','Presión uniforme'],['des','Desgaste uniforme']]}]},
    {h:'Geometría',items:[
      {t:'range',k:'r1',l:'Radio interior r₁',min:20,max:200,step:1,u:'mm'},

      {t:'range',k:'Padm',l:'Presión admisible',min:.1,max:1.5,step:.01,u:'MPa',d:2}]},

      for(let i=0;i<=10;i++){ const rr=r1+(r2-r1)*i/10, p=R.pre?1:r1/rr; g.addColorStop(i/10,rgba(C.lining,.25+.75*p)); }

    circle(V(0,0),r1,C.ink,1.2); circle(V(0,0),r2,C.ink,1.2);

    circle(V(0,0),r1*.35,C.ink,1.2,C.canvas);
    // anillo elemental
    const re=r1+(r2-r1)*.62, dr=(r2-r1)*.07; band(V(0,0),re-dr/2,re+dr/2,.15*Math.PI,.42*Math.PI,C.b1f,C.b1);
    label('dA = 2π·r·dr',mul(ue(.3*Math.PI),r2*1.18),C.b1,'center');
    // cotas

  handles(s){ return [{p:V(s.r1,0),set:w=>{s.r1=clamp(Math.round(hyp(w)),20,s.r2-10);}},{p:V(-s.r2,0),set:w=>{s.r2=clamp(Math.round(hyp(w)),s.r1+10,250);}}]; },
  readout(s,R){ return [['Presión máxima Pa',fMPa(R.Pa),1],['',fkg(R.Pa)],['Cupla transmitida T',fNm(R.T),1],['Radio medio rm',fmt(R.rm,1)+' mm'],['r₁ / r₂',fmt(R.ratio,2)],['T desgaste / T presión',fmt(R.Td/R.Tp,3)]]; },

  calc(s,R){ const r1=fmt(R.r1,0), r2=fmt(R.r2,0); return R.pre?[

      `<span class="c">Con desgaste uniforme la misma F daría T = ${fNm(R.Td)} (${fmt((R.Td/R.Tp-1)*100,1)} %).</span>`]:[

  charts(s,R){ const xs=[], yp=[], yd=[]; for(let i=0;i<=40;i++){const r=R.r1+(R.r2-R.r1)*i/40; xs.push(r); yp.push(R.Pp); yd.push(R.Pd*R.r1/r);}

/* ---------- 05 · FRENO DE DISCO ---------- */

  compute(s){ const ri=Math.min(s.ri,s.ro-5), ro=s.ro, ph=s.ph*DEG, A=ph/2*(ro*ro-ri*ri), r=2/3*(ro**3-ri**3)/(ro*ro-ri*ri), T=2*s.F*s.mu*r, P=s.F/A, frac=A/(Math.PI*(ro*ro-ri*ri));

    circle(V(0,0),R.r,C.accent,1,null,[5,5]); dim(V(0,0),mul(ue(Math.PI/2),R.r),-30,'r');

    curl(V(0,0),Math.min(50,R.ri*.6*view.s),-.6*Math.PI,-.6*Math.PI,C.muted,'ω');
    curl(V(0,0),Math.min(36,R.ri*.42*view.s),-.2*Math.PI,.5*Math.PI,C.warn,'T'); },
  handles(){ return []; },
  readout(s,R){ return [['Cupla de frenado T',fNm(R.T),1],['Radio medio r',fmt(R.r,1)+' mm'],['Área de la pastilla',fmt(R.A,0)+' mm²'],['Presión P = F/A',fMPa(R.P),1],['',fkg(R.P)],['Pastilla / pista',fmt(R.frac*100,1)+' %']]; },
  state(s,R){ return R.P>s.Padm?['bad',`La presión sobre la pastilla supera la admisible (${fMPa(R.P)} > ${fMPa(s.Padm)}).`]:['ok',`Presión dentro de lo admisible. La pastilla ocupa el ${fmt(R.frac*100,0)} % de la pista: el resto del disco se enfría mientras gira.`]; },
  calc(s,R){ return [`r = ⅔·(r<sub>e</sub>³ − r<sub>i</sub>³)/(r<sub>e</sub>² − r<sub>i</sub>²) = <span class="v">${fmt(R.r,1)} mm</span>`,

    `P = F/A = <span class="v">${fMPa(R.P)}</span>  (${fkg(R.P)})`]; },

/* ---------- 06 · CALOR Y MATERIALES ---------- */

  compute(s){ const v1=s.v1/3.6, v2=Math.min(s.v2,s.v1)/3.6, E=.5*s.m*(v1*v1-v2*v2)*s.fr, dT=E/(s.md*s.c), Tf=s.T0+dT; return {E,dT,Tf}; },
  bbox(){ return [-260,-210,260,230]; },

    path([V(x-12,y0),V(x-12,y1),V(x+12,y1),V(x+12,y0)],{fill:C.panel,stroke:C.ink,w:1.4});
    path([V(x-12,T2y(200)),V(x-12,T2y(260)),V(x+12,T2y(260)),V(x+12,T2y(200))],{fill:C.b1f});
    const col=R.Tf>260?C.warn:(R.Tf>200?C.hot:C.geo);
    circle(V(x,y0-20),16,null,1,col); path([V(x-6,y0-10),V(x-6,T2y(R.Tf)),V(x+6,T2y(R.Tf)),V(x+6,y0-10)],{fill:col});
    for(let t=0;t<=400;t+=50){ line(V(x+12,T2y(t)),V(x+22,T2y(t)),C.muted,1); label(t+' °C',V(x+28,T2y(t)),C.muted,'left'); }
    label('200 a 260 °C: máximo del revestimiento',V(x+90,T2y(230)),C.hot,'left');
    label(`${fmt(R.Tf,0)} °C`,V(x-24,T2y(R.Tf)),col,'right',false,0,0,15);
    // barra de energía
    const ex=-210, eh=Math.min(300,40+R.E/2000);
    path([V(ex,-150),V(ex,-150+eh),V(ex+40,-150+eh),V(ex+40,-150)],{fill:C.b2f,stroke:C.b2,w:1.4});
    label(fmt(R.E/1000,1)+' kJ',V(ex+20,-150+eh+14),C.b2,'center'); label('energía',V(ex+20,-170),C.muted,'center'); },
  handles(){ return []; },
  readout(s,R){ return [['Energía a absorber',fmt(R.E/1000,1)+' kJ',1],['Aumento de temperatura',fmt(R.dT,0)+' °C'],['Temperatura final',fmt(R.Tf,0)+' °C',1]]; },
  state(s,R){ return R.Tf>260?['bad','Supera la temperatura máxima de trabajo del revestimiento (200 a 260 °C).']:R.Tf>200?['warn','Entra en la zona límite del revestimiento (200 a 260 °C).']:['ok','Por debajo de la temperatura máxima del revestimiento.']; },
  calc(s,R){ return [`E = ½·m·(v₁² − v₂²)·fracción = <span class="v">${fmt(R.E/1000,1)} kJ</span>`,`ΔT = E / (m<sub>disco</sub>·c) = <span class="v">${fmt(R.dT,0)} °C</span>`,
    '<span class="c">Estimación sin pérdidas al aire: supone que todo el calor queda en el disco o tambor durante la frenada. Es el caso más desfavorable de una frenada corta.</span>']; },
  steps:[
    {t:'Energía a absorber',p:'Un freno transforma energía cinética en calor. Duplicá la velocidad inicial: ¿cuánto aumenta la energía? ¿Y la temperatura?',set:{v1:100,v2:0}},
    {t:'Masa que almacena calor',p:'Aumentá la masa del disco. ¿Por qué los vehículos pesados usan discos ventilados o tambores grandes?',set:{md:8},flash:'md'},
    {t:'Frenadas repetidas',p:'Si la frenada se repite antes de que el disco se enfríe, la temperatura inicial ya es alta. Subí la temperatura inicial a 120 °C y repetí.',set:{T0:120},flash:'T0'}]
};

const MODS={zc:ZC,zl:ZL,ci:CI,em:EM,fd:FD,ca:CA};
const STATE={}; Object.keys(MODS).forEach(k=>STATE[k]={...MODS[k].def});
let mod='zc'; const M=()=>MODS[mod], st=()=>STATE[mod];
let RES=null;

/* ---------------- panel ---------------- */
function buildPanel(){ const m=M(), s=st(), box=$('#ctrls'); box.innerHTML='';
  m.ui.forEach(sec=>{ const items=sec.items.filter(it=>!it.when||it.when(s)); if(!items.filter(it=>it.t!=='note').length) return;
    const el=document.createElement('div'); el.className='sec'; el.innerHTML=`<h3>${sec.h}</h3>`;
    items.forEach(it=>{
      if(it.t==='seg'){ const g=document.createElement('div'); g.className='seg'; g.setAttribute('role','group');
        g.innerHTML=it.opts.map(([v,t])=>`<button type="button" data-k="${it.k}" data-v="${v}" aria-pressed="${s[it.k]===v}">${t}</button>`).join(''); el.appendChild(g); }
      else if(it.t==='range'){ const f=document.createElement('div'); f.className='field'; f.dataset.k=it.k; const id='in-'+mod+'-'+it.k;
        const [mn,mx]=lim(it,s); f.innerHTML=`<label for="${id}">${it.l}</label><output id="o-${id}"></output><input type="range" id="${id}" min="${mn}" max="${mx}" step="${it.step}" value="${s[it.k]}" data-k="${it.k}">`;
        el.appendChild(f); }
      else if(it.t==='chk'){ const l=document.createElement('label'); l.className='chk'; l.innerHTML=`<input type="checkbox" data-k="${it.k}" ${s[it.k]?'checked':''}>${it.l}`; el.appendChild(l); }
      else if(it.t==='chart'){ const c=document.createElement('canvas'); c.className='pchart'; c.id=it.id; el.appendChild(c); }
      else if(it.t==='note'&&false){ const p=document.createElement('p'); p.className='cap'; p.textContent=it.x; el.appendChild(p); }
      else if(it.t==='note'){ const p=document.createElement('p'); p.className='cap'; p.textContent=it.x; el.appendChild(p); }
      else if(it.t==='html'){ const d=document.createElement('div'); d.innerHTML=it.x; el.appendChild(d); }
      else if(it.t==='state'){ const d=document.createElement('div'); d.className='state'; d.id='stateBox'; el.appendChild(d); }
      else if(it.t==='calc'){ const d=document.createElement('div'); d.className='calc'; d.id='calcBox'; el.appendChild(d); } });
    box.appendChild(el); });
  syncInputs(); }
const lim=(it,s)=>[typeof it.min==='function'?it.min(s):it.min, typeof it.max==='function'?it.max(s):it.max];
function itemSpec(k){ for(const sec of M().ui) for(const it of sec.items) if(it.k===k) return it; }
function syncInputs(){ const s=st(); if(M().fix) M().fix(s); document.querySelectorAll('#ctrls input[type=range]').forEach(inp=>{ const k=inp.dataset.k, it=itemSpec(k), [mn,mx]=lim(it,s); inp.min=mn; inp.max=mx; inp.value=s[k];
    const p=(s[k]-mn)/(mx-mn)*100; inp.style.setProperty('--fill',clamp(p,0,100)+'%');
    const o=document.getElementById('o-'+inp.id); if(o) o.textContent=fmt(s[k],it.d??0)+(it.u?' '+it.u:''); });
  document.querySelectorAll('#ctrls .seg button').forEach(b=>b.setAttribute('aria-pressed',st()[b.dataset.k]===b.dataset.v)); }
$('#ctrls').addEventListener('input',e=>{ const t=e.target; if(!t.dataset.k) return; const s=st();
  if(t.type==='range'){ s[t.dataset.k]=parseFloat(t.value); if(mod==='em'){ if(s.r1>s.r2-10) s.r1=s.r2-10; } if(mod==='fd'&&s.ri>s.ro-10) s.ri=s.ro-10; if(mod==='zl'&&s.th2<s.th1+10) s.th2=s.th1+10; }
  else if(t.type==='checkbox'){ s[t.dataset.k]=t.checked; if(t.dataset.k==='det'){ buildPanel(); } }
  syncInputs(); update(); });
$('#ctrls').addEventListener('click',e=>{ const b=e.target.closest('.seg button'); if(!b) return; const s=st(), k=b.dataset.k, v=b.dataset.v; if(s[k]===v) return; s[k]=v;
  if(mod==='ci'&&k==='modo') s.rot=v==='dif'?'ccw':'cw';
  if(mod==='zl'&&k==='modo'&&v!=='una'){ if(s.th2<150) s.th2=165; if(s.th1>15) s.th1=12; if(s.a>s.r*.9) s.a=Math.round(s.r*.77); }
  if(mod==='zl'&&k==='tipo'){ if(v==='ext'&&s.a<=s.r) s.a=Math.round(s.r*1.25); if(v==='int'&&s.a>=s.r) s.a=Math.round(s.r*.73); }
  if(['modo','tipo'].includes(k)) { buildPanel(); resetCam(); }
  syncInputs(); update(); });

/* ---------------- lectura, cálculo y estado ---------------- */
function update(){ const m=M(), s=st(); if(m.fix) m.fix(s); RES=m.compute(s);
  $('#readout').innerHTML=`<div class="rt">${m.title}</div><dl>${m.readout(s,RES).map(([k,v,key])=>`<dt>${k}</dt><dd${key?' class="key"':''}>${v}</dd>`).join('')}</dl>`;
  const sb=$('#stateBox'); if(sb){ const [cls,txt]=m.state(s,RES); sb.className='state '+cls; sb.textContent=txt; }
  const cb=$('#calcBox'); if(cb) cb.innerHTML=m.calc(s,RES).map(x=>`<div class="eq${x.startsWith('<span class="c">')?' c':''}">${x}</div>`).join('');
  if(m.charts) m.charts(s,RES);
  draw(); }

/* ---------------- dibujo ---------------- */
let handlesNow=[], hoverH=-1;
function draw(){ if(!W||!RES) return; const m=M(), s=st(); fit(m.bbox(s)); clear(); if(!m.nogrid) grid(); m.draw(s,RES);
  handlesNow=m.handles(s,RES)||[]; handlesNow.forEach((h,i)=>{ const P=S(h.p); ctx.save(); ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(P.x,P.y,i===hoverH?14:11,0,7); ctx.stroke(); ctx.restore(); }); }

/* ---------------- interacción en el lienzo ---------------- */
let drag=null;
const pt=e=>{const r=cv.getBoundingClientRect(); return V(e.clientX-r.left,e.clientY-r.top);};
const hitH=q=>handlesNow.findIndex(h=>hyp(sub(S(h.p),q))<16);
cv.addEventListener('pointerdown',e=>{ const q=pt(e), h=hitH(q); cv.setPointerCapture(e.pointerId);
  drag=h>=0?{h}:{pan:true,q,p0:{...cam().pan}}; cv.classList.add('drag'); });
cv.addEventListener('pointermove',e=>{ const q=pt(e);
  if(!drag){ const h=hitH(q); if(h!==hoverH){hoverH=h; cv.classList.toggle('over',h>=0); draw();} return; }
  if(drag.h!==undefined){ handlesNow[drag.h].set(toW(q)); syncInputs(); update(); }
  else { const k=cam(); k.pan=sub(drag.p0,V((q.x-drag.q.x)/view.s,-(q.y-drag.q.y)/view.s)); draw(); } });
const endDrag=()=>{drag=null; cv.classList.remove('drag');};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(pt(e),e.deltaY<0?1.12:1/1.12); },{passive:false});
$('#z-in').onclick=()=>zoomAt(V(W/2,H/2),1.25); $('#z-out').onclick=()=>zoomAt(V(W/2,H/2),.8);
function resetCam(){ const k=cam(); k.z=1; k.pan=V(0,0); syncZoom(); draw(); }
$('#z-fit').onclick=resetCam;
let playing=!reduced; const pb=$('#z-play'); const syncPlay=()=>{pb.textContent=playing?'Pausar giro':'Girar'; pb.setAttribute('aria-pressed',playing);}; syncPlay();
pb.onclick=()=>{playing=!playing; syncPlay();};
let spin=1; let last=0; function tick(t){ const dt=last?Math.min(50,t-last):16; last=t;
  if(mod==='zl'&&RES){ const s=st(); if(s.modo==='una'&&s.det&&s.sweep&&playing){ s._dir=s._dir||1; s.thM+=s._dir*dt*.025; if(s.thM>=s.th2){s.thM=s.th2;s._dir=-1;} if(s.thM<=s.th1){s.thM=s.th1;s._dir=1;} syncInputs(); update(); } }
  if(RES&&mod!=='ca'){ const s=st(), m=M(); const target=(playing&&!(m.stopped&&m.stopped(s,RES)))?1:0; const was=spin; spin+= (target-spin)*Math.min(1,dt*.003); if(Math.abs(spin)<.002&&target===0) spin=0;
    const sg=mod==='fd'||mod==='em'?-1:rotSign(s); phi+=sg*dt*.0012*spin; if(spin>0||was!==spin) draw(); }
  requestAnimationFrame(tick); }
requestAnimationFrame(tick);

/* ---------------- ocultar resultados ---------------- */
$('#hidebtn').onclick=()=>{ const on=$('#app').classList.toggle('hidevals'); $('#hidebtn').setAttribute('aria-pressed',on); $('#hidebtn').textContent=on?'Mostrar resultados':'Ocultar resultados'; };

/* ---------------- guía de pasos ---------------- */
const STEP={}; Object.keys(MODS).forEach(k=>STEP[k]=0);
function renderSteps(){ const L=M().steps||[]; const i=STEP[mod];
  $('#steps').innerHTML=L.map((s,j)=>`<button type="button" aria-current="${j===i}" aria-label="Paso ${j+1}: ${s.t}" data-step="${j}">${j+1}</button>`).join('');
  $('#g-title').textContent=L[i]?L[i].t:''; $('#g-text').textContent=L[i]?L[i].p:''; }
$('#steps').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const j=+b.dataset.step, L=M().steps; STEP[mod]=j; const sp=L[j];
  const prevModo=st().modo; Object.assign(st(),sp.set||{}); if(st().modo!==prevModo) resetCam(); buildPanel(); renderSteps(); update();
  if(sp.flash){ const f=document.querySelector(`#ctrls .field[data-k="${sp.flash}"]`); if(f){ f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); } } });

/* ---------------- módulos ---------------- */
function go(k){ mod=k; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.go===k));
